<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Light Bulb with Pull Chain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="room">
        <div class="bulb-container">
            <div class="cord"></div>
            
            <div id="bulb" class="bulb off">
                <div class="filament"></div>
            </div>

            <!-- Hanging Pull-Chain Element -->
            <div id="pull-chain" class="pull-chain" title="Pull to toggle light">
                <div class="chain-line"></div>
                <div class="chain-bead"></div>
                <div class="chain-bead"></div>
                <div class="chain-bead"></div>
                <div class="chain-bead"></div>
                <div class="chain-handle"></div>
            </div>
        </div>

        <div class="controls">
            <label class="switch">
                <input type="checkbox" id="toggle">
                <span class="slider"></span>
            </label>
            <p>Power Switch / Pull Chain</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
